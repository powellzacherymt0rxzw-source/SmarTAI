name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  backend-sqlite:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r render-requirements.txt
      - name: Compile
        run: python -m compileall -q backend
      - name: Test (SQLite)
        env:
          SMARTAI_DATABASE_URL: "sqlite:////tmp/smartai-ci.db"
          SMARTAI_DATABASE_HEAVY: "OFF"
          SMARTAI_DATABASE_URL_LIGHT: "sqlite:////tmp/smartai-ci.db"
          SMARTAI_DATABASE_AUTO_CREATE: "true"
          SMARTAI_SEED_TEST_USERS: "false"
          SMARTAI_PROVIDER_ENCRYPTION_KEY: ci-provider-master-key
          SMARTAI_GRADING_ENGINE: v2
        run: python -m pytest backend/tests -q

  backend-postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartai
          POSTGRES_PASSWORD: smartai
          POSTGRES_DB: smartai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartai" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r render-requirements.txt
      - name: Apply PostgreSQL migration
        env:
          SMARTAI_DATABASE_HEAVY: "ON"
          SMARTAI_DATABASE_URL: "postgresql+psycopg://smartai:smartai@localhost:5432/smartai_test"
          SMARTAI_DATABASE_URL_HEAVY: "postgresql+psycopg://smartai:smartai@localhost:5432/smartai_test"
        run: |
          alembic upgrade head
      - name: Test PostgreSQL integration
        env:
          SMARTAI_DATABASE_HEAVY: "ON"
          SMARTAI_DATABASE_URL: "postgresql+psycopg://smartai:smartai@localhost:5432/smartai_test"
          SMARTAI_DATABASE_URL_HEAVY: "postgresql+psycopg://smartai:smartai@localhost:5432/smartai_test"
          SMARTAI_SEED_TEST_USERS: "false"
          SMARTAI_PROVIDER_ENCRYPTION_KEY: ci-provider-master-key
          SMARTAI_GRADING_ENGINE: v2
          SMARTAI_TEST_POSTGRES_URL: "postgresql+psycopg://smartai:smartai@localhost:5432/smartai_test"
        run: python -m pytest backend/tests/test_postgres_integration.py -q
      - name: Verify PostgreSQL migration round trip
        env:
          SMARTAI_DATABASE_HEAVY: "ON"
          SMARTAI_DATABASE_URL: "postgresql+psycopg://smartai:smartai@localhost:5432/smartai_test"
          SMARTAI_DATABASE_URL_HEAVY: "postgresql+psycopg://smartai:smartai@localhost:5432/smartai_test"
        run: |
          # The focused fixture cleans its schema after the last test. Restore
          # head first so downgrade exercises the real migrated schema.
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend (typecheck + audit + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit visible scope
        run: npm run audit:scope
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r ../render-requirements.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: |
          # Start the backend on a fixed port with a throwaway SQLite DB, then
          # run the Playwright suite against it. The workflow stops the server
          # afterwards regardless of test outcome.
          (cd ../.. && SMARTAI_DATABASE_HEAVY=OFF SMARTAI_DATABASE_URL=sqlite:////tmp/smartai-e2e.db SMARTAI_DATABASE_URL_LIGHT=sqlite:////tmp/smartai-e2e.db SMARTAI_STORAGE_ROOT=/tmp/smartai-e2e-uploads SMARTAI_DATABASE_AUTO_CREATE=true SMARTAI_SEED_TEST_USERS=false SMARTAI_ALLOW_DEMO_TOKENS=true SMARTAI_E2E_FAKE_PROVIDER=true SMARTAI_E2E_FAIL_QID=q1 SMARTAI_PROVIDER_ENCRYPTION_KEY=e2e-master-key SMARTAI_GRADING_ENGINE=v2 python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &)
          npx --yes wait-on -t 30000 http://127.0.0.1:8000/ready || (cat /tmp/backend.log && exit 1)
          npm run e2e
